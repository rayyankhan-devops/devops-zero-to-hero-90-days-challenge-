# SonarQube Project Configuration
# Used by SonarQube Scanner for SAST & SCA analysis

sonar.projectKey=securevault
sonar.projectName=SecureVault - DevSecOps Demo
sonar.projectVersion=1.0.0

# Source code paths
sonar.sources=services,shared,frontend
sonar.tests=services

# Language settings
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions (don't scan these)
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/node_modules/**,**/migrations/**

# Test file patterns
sonar.test.inclusions=services/**/tests/**

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage
sonar.python.xunit.reportPath=test-results.xml
