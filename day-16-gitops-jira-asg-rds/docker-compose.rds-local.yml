name: rds-local-test

services:
  mysql-rds-simulator:
    image: mysql:8.0
    container_name: rds_mysql_local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: devops_db
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    ports:
      - "3306:3306"
    volumes:
      - rds_data:/var/lib/mysql

volumes:
  rds_data:
