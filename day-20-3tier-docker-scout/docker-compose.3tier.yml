name: day20-3tier-stack

services:
  frontend:
    image: nginx:alpine
    container_name: frontend_3tier
    ports:
      - "3000:80"
    networks:
      - app_net
    depends_on:
      - backend

  backend:
    image: node:20-alpine
    container_name: backend_3tier
    ports:
      - "5000:5000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
    networks:
      - app_net
    depends_on:
      - database

  database:
    image: postgres:17-alpine
    container_name: database_3tier
    environment:
      POSTGRES_PASSWORD: secretpassword
    networks:
      - app_net
    volumes:
      - db_data:/var/lib/postgresql/data

networks:
  app_net:
    driver: bridge

volumes:
  db_data:
